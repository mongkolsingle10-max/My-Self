# The Site Configuration
theme: jekyll-theme-chirpy
lang: en
timezone: Asia/Phnom_Penh

title: Sambath Mongkol
tagline: IT Support Specialist • Web Developer • Systems & Network
description: >-
  Portfolio of Sambath Mongkol — IT Support Specialist & Web Developer. Experienced in Windows Server, Active Directory, MikroTik Networking, Synology NAS, Angular, Full-Stack Web Development, and n8n AI Automation.

url: "https://mongkolsingle10-max.github.io"

github:
  username: mongkolsingle10-max

social:
  name: Sambath Mongkol
  email: sambathmongkol89@gmail.com
  links:
    - https://github.com/mongkolsingle10-max

theme_mode: dark
avatar: "/assets/img/avatar.jpg"
live2d: false
post_view: false
related_posts: true
copyright: true
social_share: true
date_format: "en"
toc: true

collections:
  tabs:
    output: true
    sort_by: order

markdown: kramdown
highlighter: rouge

defaults:
  - scope:
      path: ""
      type: posts
    values:
      layout: post
      comments: true
      toc: true
      author: Sambath Mongkol
  - scope:
      path: ""
      type: tabs
    values:
      layout: page
      dynamic_title: true

sass:
  style: compressed

permalink: /posts/:title/
paginate: 10

plugins:
  - jekyll-paginate
  - jekyll-sitemap
  - jekyll-feed
  - jekyll-seo-tag

exclude:
  - static_site/
  - README.md
  - LICENSE
