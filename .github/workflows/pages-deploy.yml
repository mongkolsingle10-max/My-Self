name: "Deploy Portfolio to GitHub Pages"

on:
  push:
    branches:
      - main
      - master
    paths-ignore:
      - .gitignore
      - README.md
      - LICENSE

  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Pages
        id: pages
        uses: actions/configure-pages@v5

      - name: Verify Zero-Trust Security & Bilingual Assets
        run: |
          test -f static_site/index.html
          test -f static_site/assets/js/security-shield.js
          test -f static_site/assets/js/i18n-translator.js
          test -f static_site/.well-known/security.txt
          test -f static_site/404.html
          touch static_site/.nojekyll
          echo "All portfolio, security, and i18n assets verified."

      - name: Upload Pages Artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: "static_site"

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
