name: "Build, Security Audit & Deploy Pages"

on:
  push:
    branches:
      - main
      - master
    paths-ignore:
      - .gitignore
      - README.md
      - LICENSE

  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          submodules: true

      - name: Setup Pages
        id: pages
        uses: actions/configure-pages@v5

      - name: Verify Zero-Trust Security Assets
        run: |
          test -f static_site/assets/js/security-shield.js
          test -f static_site/assets/js/i18n-translator.js
          test -f static_site/.well-known/security.txt
          test -f static_site/404.html
          echo "Zero-Trust Security Shield & Bilingual i18n assets verified."

      - name: Prepare Production Artifact
        run: |
          mkdir -p "_site${{ steps.pages.outputs.base_path }}"
          cp -r static_site/. "_site${{ steps.pages.outputs.base_path }}/"

      - name: Upload Pages Artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: "_site${{ steps.pages.outputs.base_path }}"

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
